    <section class="form-wrapper">
        <div class="form-header">
            <h2>FORMULARIO DE CONTACTOS</h2>
        </div>
            
        <!-- Se agrega el id="miFormulario" -->
        <form id="miFormulario" class="contact-form">
            <div class="form-group">
                <label for="nombre">NOMBRE COMPLETO</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="form-group">
                <label for="correo">CORREO</label>
                <input type="email" id="correo" name="correo" required>
            </div>

            <div class="form-group">
                <label for="contenido">CONTENIDO</label>
                <textarea id="contenido" name="contenido" rows="5" required></textarea>
            </div>

            <div class="button-container">
                <!-- Se cambia type="submit" por type="button" y se añade onclick -->
                <button type="button" class="submit-btn" onclick="enviarMensaje()">ENVIAR MENSAJE</button>
            </div>
        </form>
    </section>
