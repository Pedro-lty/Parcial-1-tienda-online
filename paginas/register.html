<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
    <link rel="stylesheet" href="/estilos/style-login-register.css">
    <link rel="icon" href="/images/favicon.webp">
</head>
<body>
    <main class="card-register">
        <header class="contenedor1">
            <h1>Registrarse</h1>
            <h2>Registro de Usuario</h2>
        </header>

        <form class="register">
            <div class="input-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" placeholder="Tu nombre">
            </div>

            <div class="input-group">
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" placeholder="Tu apellido">
            </div>

            <div class="input-group">
                <label for="rut">RUT</label>
                <input type="text" id="rut" placeholder="12.345.678-k">
            </div>

            <div class="input-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="correo@ejemplo.com">
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password">
            </div>

            <div class="input-group">
                <label for="passwordConfirmed">Confirmar Contraseña</label>
                <input type="password" id="passwordConfirmed">
            </div>

            <div class="input-group">
                <label for="telefono">Número de Teléfono</label>
                <input type="tel" id="telefono" placeholder="+56 9 1234 5678">
            </div>

            <div class="input-group">
                <label for="region">Región</label>
                <select name="region" id="region">
                    <option value="" selected disabled>-- Seleccione la región --</option>
                    <option value="rm">Metropolitana</option>
                </select>
            </div>

            <div class="input-group">
                <label for="comuna">Comuna</label>
                <select name="comuna" id="comuna">
                    <option value="" selected disabled>-- Seleccione la comuna --</option>
                    <option value="maipu">Maipú</option>
                    <option value="cerrillos">Cerrillos</option>
                </select>
            </div>

            <p>¿Ya tienes una cuenta?
                <a href="/paginas/login.html" class="text-nextpage">Inicia sesion aqui</a>
            </p>

            <input type="submit" value="Registrarse" class="btn-submit">
        </form>
    </main>

    <div class="btn-inicio">
            <a href="/inicio.html">Volver al Inicio</a>
    </div>
</body>
<script src="/scripts/scriptRegister.js"></script>
</html>
